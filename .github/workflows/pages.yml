# gliderGo in a browser, published to GitHub Pages.
#
# HONEST CAVEAT, READ FIRST. Like ci.yml and release.yml this was written on a host that cannot
# reach github.com, and unlike them it has never run: the first release tag after it lands is its
# first run. What is verified is every command it invokes. `make web` builds the site
# and `make web-check` plays it in headless Chrome against the native build, here, with Go 1.23
# and Chrome 157. What is not is everything that belongs to GitHub: the two Pages actions and
# their versions, the runner's Chrome, and the Pages settings below. RELEASING.md says what to
# look at after the first run.
#
# WHAT IT PUBLISHES. bin/web/ as `make web` writes it: the game built for GOOS=js GOARCH=wasm, the
# page around it (web/), Go's wasm_exec.js from the toolchain that built the binary, the licences,
# and build.js, which names the version and the commit. The page's source link is that commit, so
# what a player is running links the exact source it was built from (GPLv2 section 3, as the
# release archives do). It is served at https://bwenstar.github.io/gliderGo/, and it is static:
# nothing on the server runs, which is why a browser cannot race (docs/IMPROVEMENTS.md 3.10).
#
# WHEN. On the same `v*` tags release.yml builds archives from, so the page is always the latest
# release and never a commit between two. A tag with a hyphen in it -- v0.3.0-rc1 -- builds and
# checks the page and does not publish it: an rc is a rehearsal, and the page is what a stranger
# is sent to. workflow_dispatch publishes a tag that already exists, which is how the page gets its
# first release when Pages is switched on after that tag was made, and how a deploy GitHub
# refused is tried again.
#
# ONCE, BEFORE THE FIRST TAG, in the repository's settings (RELEASING.md has the clicks): Pages
# takes its source from "GitHub Actions", and the github-pages environment allows deployments from
# `v*` tags. A deploy refused for either is this workflow's deploy job failing on its first step.

name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish (e.g. v0.3.0)"
        required: true

# Read by default; the deploy job alone opts into what Pages needs.
permissions:
  contents: read

# One deploy at a time, and a second never cancels the first: a deploy cut off halfway leaves the
# site as it was, but it leaves nobody sure which version that is.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GOPROXY: "off"
  GOTOOLCHAIN: local
  # The Go releases are built with: ci.yml's env says why at length, and this line moves with the
  # two there and in release.yml. The page is built with it so that the wasm a player runs is the
  # Go that patches have reached, and so that wasm_exec.js, which comes from the same toolchain,
  # is the one that binary expects.
  GO_RELEASE: "1.27.x"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # The tag, from the push or from the dispatch input, held to the shape release.yml allows.
      # The input arrives through env and not ${{ }} inside the script, for release.yml's reason:
      # ${{ }} is pasted into the script before bash reads it, so an input with a quote in it
      # would be code.
      - name: Resolve the tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9.+_-]*$ ]]; then
            echo "::error::the tag must look like v1.2.3, got '$tag'"
            exit 1
          fi
          publish=true
          case "$tag" in *-*) publish=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building the page for $tag; publishing it: $publish"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false

      # The binary is the assets, as every build's is.
      - name: Refuse a checkout that is missing the archives the binary embeds
        run: |
          test -s assets/extracted.zip
          test -s assets/levels.zip

      # web-check builds the page itself, with the same VERSION, before it plays it: the title
      # screen it compares carries the version string, so the two builds have to agree on it.
      # CHROME is named so that a runner without one fails here rather than skipping, which is
      # what `make check` would do with no Chrome on PATH; google-chrome is on GitHub's Ubuntu
      # images.
      - name: Build the page and play it in headless Chrome against the native build
        env:
          VERSION: ${{ steps.v.outputs.tag }}
        run: make web-check VERSION="$VERSION" CHROME=google-chrome OUT="$RUNNER_TEMP"

      - name: Keep what a failed check left to be looked at
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: webcheck
          path: ${{ runner.temp }}/glidergo-webcheck
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v4
        with:
          path: bin/web

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
