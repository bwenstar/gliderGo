# gliderGo CI, for the public GitHub path.
#
# HONEST CAVEAT, READ FIRST. This file was written on the airgapped host the port is being
# developed on, which cannot reach github.com, so it is authored blind: nothing below can be
# verified end to end from here -- not the action versions, not the runner package names, not
# xvfb. What *is* verified is every command it invokes: `make check` was run here on a fresh
# no-asset tree with DISPLAY unset and passed, `make cross` builds all six cross targets plus the
# host's own cgo build, and the depth-24 requirement the x11 backend imposes was confirmed against
# a nested X server.
#
# It has run on GitHub since, and the prediction above held: the first push needed two
# corrections. The action versions had to move off Node 20 (checkout v4 -> v5, setup-go v5 -> v6),
# and windows-latest failed `go test ./...` on two tests that had spelled a path the way Linux
# spells one. Both are fixed. Whether the current run is green is not visible from this host, so
# this comment does not claim it.
#
# The `native` job's Windows half is the exception to "verified locally": nothing here can run a
# Windows binary. It used to be the first execution of internal/platform/win32 and of the waveOut
# audio sink in existence; that is no longer so -- both have since been run on a Windows Server 2025
# desktop, which is written up in docs/windows-first-run.md -- but this job is still the only thing
# that runs them on every push, and it remains the first place a Windows regression shows up.
#
# Its bench step is deliberately continue-on-error, and the reason has narrowed rather than gone
# away: a hosted runner's agent runs as a service, so what that step exercises is the no-visible-
# desktop case, which is exactly the one the manual run could not cover. A failure there is a log
# worth reading, not a red X on an unrelated pull request. Its `go test` step is not best-effort,
# because internal/audio's Windows tests were written to be safe on a runner with no sound card:
# they load winmm and resolve its entry points, which either works or is a real defect.
#
# WHAT THIS DOES NOT DO. Releases are release.yml's job, not this one, and the split is
# deliberate: this workflow runs on pushes to main, on pull requests and weekly, and release.yml
# runs on `v*` tags -- which this one does not match, so tagging deliberately does not fire the
# whole CI matrix twice. The cross-compiled binaries uploaded here are for inspection only; the packaged,
# checksummed archives come from release.yml. There is still no installer, and there no longer
# needs to be one for the game to be playable from a download: every executable carries its own
# assets (assets/assets.go), so a binary out of the artifact below runs from wherever it is put.

name: CI

# `push` is the default branch only, deliberately. With `branches: ["**"]` every push to a branch
# that has a pull request open ran this whole matrix twice over the same commit -- once for the
# push and once for the pull_request -- and the concurrency group below cannot collapse those two,
# because their refs differ (refs/heads/x against refs/pull/N/merge). Work on a branch is covered
# by opening the pull request; a branch with no pull request is covered by workflow_dispatch, which
# takes a ref.
#
# And once a week, for the `vuln` job: a Go security release that lands between two pushes is
# found on the Monday after it rather than at the next tag. The rest of the matrix runs too, which
# costs nothing on a public repository and also finds a runner image that changed under the build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# One run per ref: a second push to the same branch cancels the first rather than queueing behind
# it, since nobody wants the results of the commit they have already replaced. Cancelling is safe
# here in a way it would not be in release.yml -- this workflow publishes nothing, so an
# interrupted run leaves nothing half-done.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both are the repo's defaults, restated so a CI log shows them. gliderGo has no
  # dependencies -- internal/module asserts it -- so `off` should never bite; if it ever does,
  # that is the news. GOTOOLCHAIN=local keeps the Go that setup-go installed.
  GOPROXY: "off"
  GOTOOLCHAIN: local
  # The Go that releases are built with, which is not go.mod's `go 1.23` (docs/IMPROVEMENTS.md
  # 5.11). That line is the oldest Go that can build the code, and Go stopped patching 1.23 when
  # 1.25 shipped; a release built with it carried three standard-library vulnerabilities its
  # code reaches, in the listener's dial, the directory walk and the zip reader. `check` and
  # `citations` stay on go.mod so the floor README promises is still tested; `cross`, `native`
  # and `vuln` use this, and so does release.yml, which states it again. A newer Go keeps
  # 1.23's GODEBUG defaults, because those follow the `go` line, and the engine fingerprint
  # does not move (TestTheEngineFingerprintIsPinned), so a 1.27 build races a 1.23 one.
  #
  # The patch floats, with check-latest, so each run takes the newest one; `go version -m` on a
  # binary says which it got. The minor moves when Go stops patching it -- Go supports the two
  # newest, and a new one ships every six months -- and each move re-reads the new minor's
  # "Ports" notes, because the oldest macOS and Windows a build runs on come from the Go that
  # built it (README's "Getting a build").
  GO_RELEASE: "1.27.x"

jobs:
  # ---------------------------------------------------------------------------
  # The real check: Linux, cgo on, x11 compiled, assets extracted, pixels compared.
  # This is the only job that runs the fidelity corpus, because it is the only one with a
  # libX11 and an extracted asset tree.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # libx11-dev is the one hard requirement, and it is a hard one: without its pkg-config
      # metadata `make check` FAILS -- `vet` and `test` compile internal/platform/backend, which
      # resolves to the x11 file whenever cgo is on, and the error is pkg-config's rather than
      # anything the Makefile writes. There is no silent fallback to the null backend; that is
      # `make headless` (or `-tags nullbackend`), asked for explicitly. check-caveats does have a
      # branch that reports the missing metadata, but it can only be reached by invoking
      # `make check-caveats` directly. xvfb is for the on-screen bench at the end.
      # libxext-dev and libasound2-dev are deliberately absent: internal/platform/x11 states it
      # does not use MIT-SHM, and the audio target mixes to a WAV rather than to a device.
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev xvfb

      # go.mod's `go` directive, the floor, which scripts/bootstrap-dev-env.sh also reads: this
      # job is what keeps README's "Go 1.23 or newer" true. Releases are built with GO_RELEASE
      # instead, and release.yml's `verify` runs this same `make check` on that. cache: false is
      # not an optimisation choice -- setup-go's cache wants a go.sum to key on, and there is none
      # to have.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Report the environment
        run: make doctor

      # No extraction step and no cache: assets/extracted/ is committed (see
      # docs/IMPROVEMENTS.md 1.2), so the checkout above already has the art, the sounds and the
      # 22 houses. What used to be a cache-and-extract dance is now the `assets` job below,
      # which verifies the committed tree instead of rebuilding it here.
      #
      # This step exists because a checkout that silently lost the assets would still pass:
      # make's guards would skip the asset-dependent steps and `check` would go green. Refuse.
      #
      # Both copies are named. extracted.zip is the one compiled into every binary, and a build
      # without it fails on its own (the Makefile's `embedded` guard) -- naming it here says which
      # file is missing rather than which target stopped. extracted/ is the working tree the pixel
      # corpus and the house round-trip read by path, and the one `make assets-check` re-extracts
      # against. `go test ./assets`, inside `make check`, is what proves the two agree.
      #
      # levels.zip is the second embedded archive: the houses written for this port, which every
      # release carries beside the twenty-two. It is committed for a reason worth knowing here --
      # `make levels` rebuilds it with bin/glidertool and glidertool embeds it, so a checkout
      # without it cannot bootstrap its way back. There is nothing this job could run to recover.
      - name: Refuse a checkout that is missing its assets
        run: |
          test -s assets/extracted.zip
          test -s assets/levels.zip
          test -s assets/extracted/art/manifest.json
          test -s assets/extracted/sound/manifest.tsv
          ls assets/extracted/houses/*.house >/dev/null

      # OUT keeps the scratch PNGs and WAVs out of /tmp, so two jobs on one self-hosted runner
      # cannot collide. On a GitHub-hosted runner each job has its own VM and this is free.
      - name: make check
        run: make check OUT="$RUNNER_TEMP"

      # The one thing `make check` cannot do without a display: put real pixels through
      # XPutImage. Depth matters and is the likeliest thing to break here --
      # internal/platform/x11 rejects anything but 24 or 32 ("unsupported display depth 8"),
      # and Xvfb's historical default is 8. Hence the explicit screen argument.
      - name: On-screen bench under Xvfb
        run: xvfb-run -a -s '-screen 0 640x480x24' make bench

      # internal/platform/x11's one test asks the server whether New turned on XKB's detectable
      # auto-repeat, and skips when DISPLAY is unset, which `make check` above always is here.
      # Without this step a runner never asks (docs/IMPROVEMENTS.md 2.72). -noreset stops Xvfb
      # resetting when a client disconnects, so the test's window cannot race a reset.
      - name: X11 backend test under Xvfb
        run: xvfb-run -a -s '-screen 0 640x480x24 -noreset' go test -count=1 -v ./internal/platform/x11/

      - name: Upload the shell screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shell-screens
          path: ${{ runner.temp }}/glidergo-shell
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The committed assets are output, and this is what stops them drifting from their source:
  # re-extract from GliderPRO/ and compare every file. A failure means either the extractor
  # changed without the tree being regenerated, or somebody hand-edited an asset.
  #
  # Its own job for a duller reason than it used to be. The extractor wrote assets/extracted/
  # in place with no temp-and-rename, so it could not run beside anything that read the tree --
  # a concurrent `go test` once failed decoding a half-written golden PNG. That is fixed
  # (docs/IMPROVEMENTS.md 5.2): it stages into a dotted sibling, renames it into place, and
  # holds a lock, so a second run refuses instead of interleaving. What is left is cost --
  # python3 and a minute of CPU that the Go jobs have no reason to wait for.
  # ---------------------------------------------------------------------------
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the committed assets are what the extractor produces
        run: make assets-check OUT="$RUNNER_TEMP"

  # ---------------------------------------------------------------------------
  # The citations, resolved. The only job in this file that fetches anything from outside this
  # repository, and the only place on earth where internal/citations does not skip.
  #
  # docs/ makes about 17,800 claims of the form `GliderPRO/Sources/Player.c:1234`, and they are the
  # whole evidence that this port is a transcription rather than an imitation. Checking one means
  # opening the 1994 C -- which is not redistributed here, for licence reasons that
  # GliderPRO/README.md sets out -- so internal/citations skips when the tree is absent, which on a
  # developer's machine is most of the time and on a fresh clone is always. That is what this job is
  # for: clone upstream at the pin, and let the sweep actually run.
  #
  # Its own job rather than a step in `check`, for three reasons. It needs the network, and `check`
  # is otherwise hermetic -- worth keeping, because it is the thing a contributor runs locally. It
  # needs no libX11, no assets and no Go cgo, so it starts and finishes while `check` is still
  # installing apt packages. And a failure here says something categorically different from a
  # failure there: a red `check` means the game is wrong, a red `citations` means the documentation
  # is, and reading one stack of logs to find out which is a waste of somebody's afternoon.
  #
  # The clone is a plain full one, and that is a choice against the obvious `--depth 1`. A shallow
  # clone lands on the default branch's tip, and getting it onto an arbitrary older revision needs a
  # second fetch of that revision by name -- which works on GitHub and needs a server setting to do
  # it, and is not a thing that can be confirmed from the airgapped host this file was written on.
  # glider_pro is a few megabytes of 1994 C; the history is cheaper than the cleverness.
  #
  # The `rev-parse` check after it is not ceremony. Everything this job reports is line numbers
  # against files, so a tree at the wrong revision does not fail -- it produces a page of confident
  # wrong failures that read as this repository's fault, and the first person to see them would go
  # looking in docs/ for defects that are not there.
  # ---------------------------------------------------------------------------
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # The pin is read out of internal/project rather than written here, so that this file is not
      # an eleventh place it has to be kept in step --
      # TestEveryPlaceThePinIsWrittenNamesTheSameCommit holds the other ten together, and it can
      # only hold what is inside the repository.
      - name: Clone John Calhoun's 1994 C at the pinned commit
        run: |
          pin=$(grep -oE '\b[0-9a-f]{40}\b' README.md | head -n1)
          test -n "$pin" || { echo "README.md no longer names a full upstream revision"; exit 1; }
          echo "pin: $pin"
          git clone --quiet https://github.com/softdorothy/glider_pro /tmp/glider_pro
          git -C /tmp/glider_pro checkout --quiet "$pin"
          test "$(git -C /tmp/glider_pro rev-parse HEAD)" = "$pin"
          cp -r /tmp/glider_pro/Sources /tmp/glider_pro/Headers /tmp/glider_pro/Prefix.h GliderPRO/

      # Named explicitly rather than left to `go test ./...`, because the point of this job is that
      # these tests RAN. `go test` prints "ok" for a package whose every test skipped, so a
      # mistyped path above would leave this job green and prove nothing; -v puts each SKIP on the
      # log where it is visible, and the grep below turns one into a failure.
      - name: Resolve every citation against the original
        run: |
          set -o pipefail
          go test -v ./internal/citations/ 2>&1 | tee citations.log
          if grep -q '^--- SKIP' citations.log; then
            echo "::error::a citation check skipped, so the 1994 C did not reach this job"
            exit 1
          fi

      # The two log lines worth having without opening anything: how many citations resolved and
      # how many of our own references did. They are the measurements the README quotes.
      - name: Put the counts on the job summary
        if: always()
        run: |
          [ -f citations.log ] || exit 0
          {
            printf '## Citations\n\n```\n'
            grep -E 'checked [0-9]+|in agreement' citations.log || printf '(no counts reported)\n'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # The tree this job assembled is NOT uploaded. It is John Calhoun's GPLv2 source, and this
      # repository does not redistribute it (GliderPRO/README.md); an artifact would be exactly
      # that, wearing a different hat.

  # ---------------------------------------------------------------------------
  # Every target a release would ship. Compiles only: the windows rows do contain a real backend
  # now, but a green build says it compiles and nothing more -- see `make cross`'s comment, and
  # the `native` job below for the one that actually runs it.
  # ---------------------------------------------------------------------------
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # For the last row of `make cross` only: the host's own cgo build, which is the one Linux
      # binary in the artifact that can draw. That row is skipped rather than failed when x11
      # pkg-config metadata is absent, so without this step whether `glidergo-linux-amd64-x11`
      # appears at all depends on what the runner image happens to ship -- and its absence is a
      # quiet one. Somebody downloading the artifact would get `glidergo-linux-amd64`, the
      # CGO_ENABLED=0 build, and find a game that runs and shows nothing. The twelve
      # cross-compiled binaries need none of this.
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev

      # GO_RELEASE rather than go.mod: these are the binaries a release would ship, so they are
      # built with the Go it would build them with.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false
      - run: make cross

      # Thirteen binaries: glidergo and glidertool for each of the six cross targets, plus the
      # host's cgo glidergo as `-x11`. Each one carries its own assets and would play from the
      # download, but they are inspection copies and not a release: unpackaged, unchecksummed, no
      # licence and no note saying which of them can draw. That is release.yml's job, on `v*` tags.
      - uses: actions/upload-artifact@v5
        with:
          name: cross-binaries
          path: bin/cross/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Known vulnerabilities in what a release is built from (docs/IMPROVEMENTS.md 5.11). gliderGo
  # requires no module, so that is the standard library of GO_RELEASE: its listener, its dialer,
  # its PNG and zip readers. govulncheck reports a vulnerability only when a call path reaches it,
  # and says which.
  #
  # Scanned once per operating system a release ships for, because what is compiled differs:
  # netplay's dial errors, the audio sinks and the platform backends are per-OS files, and the
  # standard library's are too. libX11 is installed so the linux scan compiles the x11 backend,
  # which the linux-amd64 archive is built with.
  #
  # The one step that reaches a network other than GitHub's is the install, and it installs a tool:
  # `go install pkg@version` writes no `require`, so internal/module still passes. The version is
  # pinned so a new govulncheck is a change somebody made; it needs Go 1.26 or newer to build.
  #
  # A finding fails this job. It gets an entry in docs/IMPROVEMENTS.md saying what reaches it --
  # netplay, a decoder, a tool that does not ship -- and a release follows if a shipped binary does
  # (SECURITY.md, "Versions"). release.yml runs the same scan and will not tag past one.
  # ---------------------------------------------------------------------------
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false

      - name: Install govulncheck
        env:
          GOPROXY: https://proxy.golang.org
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck, as each operating system a release ships for
        run: |
          go version
          for goos in linux windows darwin; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/govulncheck" ./...
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Windows and macOS, natively. Two different jobs wearing one matrix.
  #
  # On macOS the port still has no backend, so this proves the portable four-fifths: game logic,
  # house loader, asset pipeline, shell composition, scores, replay. On a real filesystem with a
  # real path separator, which is the part cross-compiling from Linux cannot check.
  #
  # On Windows it is more than that, and it is the most important job in this file. The win32
  # backend and the waveOut audio sink were written on an airgapped Linux host with no Windows to
  # run them on, so this is where a Windows toolchain compiles them and where their tests run on
  # every push. They have been executed on a real desktop once, by hand, which is what closed the
  # "never run" caveat -- see docs/windows-first-run.md and the notes in
  # internal/platform/win32/win32.go and internal/audio/waveout_windows.go -- but that was one
  # machine on one afternoon, and this job is what keeps it true.
  #
  # `make` is not installed on windows-latest, so these steps call go and python directly
  # rather than through the Makefile.
  # ---------------------------------------------------------------------------
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_RELEASE }}
          check-latest: true
          cache: false

      - run: go build ./...
      - run: go vet ./...

      # The assets are committed, so this job's `go test` runs the asset-dependent tests on
      # Windows and macOS without an extraction step -- which is a stronger check than it used
      # to be: it reads 1994 binary data through a real filesystem on both platforms.
      #
      # On Windows it also runs internal/audio's waveout_windows_test.go, which is the first
      # execution of the audio sink's loader anywhere: GetSystemDirectoryW, an absolute-path load
      # of winmm.dll and a FindProc for each of the seven waveOut entry points. A hosted runner
      # has no sound card, so the test that opens the device skips there and only a machine with
      # one plays (silence) -- but a misspelt export or a mishandled path length fails here.
      #
      # The extractor itself is stdlib-only python3 that has only ever run on Linux, so it is
      # run here too, best-effort: a platform-specific path or newline bug in it is plausible
      # and is a real finding for docs/IMPROVEMENTS.md rather than a reason to hide the step.
      # It writes to a temp tree so it cannot dirty the checked-out assets.
      #
      # bash rather than the runner's default shell, which is PowerShell on Windows, and an
      # explicit pipefail: a PowerShell pipeline reports the exit status of the last command in
      # it, so `go test | tee` there would report tee's success and turn a failing test suite
      # green. Actions' bash already runs with -eo pipefail; saying so is cheap and makes the
      # step readable without knowing that.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "go-test-${{ matrix.os }}.log"

      # Only when the step above went red. `go test` names the failing test and prints its
      # message without -v, so the information was always there -- but it was there in a job log
      # that has to be opened before it expires, and the first Windows failure on this matrix had
      # to be diagnosed from an exit code and nothing else because the log was gone by the time
      # anyone looked. This copies the FAIL lines onto the job's summary page, which renders in a
      # browser with no gh and no download, and keeps the whole transcript as an artifact for the
      # cases where the failure is not in a line matching this grep.
      #
      # Neither step makes the suite tolerate failure: there is no continue-on-error here, and a
      # red test step still fails the job.
      - name: Put the failing tests on the job summary
        if: failure()
        shell: bash
        run: |
          log="go-test-${{ matrix.os }}.log"
          [ -f "$log" ] || exit 0
          # The test's own message lines are indented and start "file.go:NN:", which is what
          # actually says why it failed; the FAIL/panic lines only say that it did.
          fails=$(grep -E '^(--- FAIL|FAIL|panic:|fatal error:)|^[[:space:]]+[A-Za-z0-9_-]+\.go:[0-9]+:' "$log" | head -n 100 || true)
          [ -n "$fails" ] || fails='(nothing matched: the run died before any test reported. The full log is in the go-test-log artifact on this run.)'
          {
            printf '## `go test ./...` failed on %s\n\n' '${{ matrix.os }}'
            printf 'Full transcript: the **go-test-log-%s** artifact on this run.\n\n' '${{ matrix.os }}'
            printf '```\n%s\n```\n' "$fails"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: go-test-log-${{ matrix.os }}
          path: go-test-${{ matrix.os }}.log

      # Build the game, open a real window and push 300 frames through StretchDIBits. Everything
      # before this step only proves it compiles.
      #
      # Best-effort on purpose, and the reason is not timidity. A hosted Windows runner is not a
      # desktop -- the agent runs as a service, so whether CreateWindowExW and a window DC behave
      # as they do in front of a logged-in user is exactly the sort of thing that cannot be
      # settled from here. The logged-in case has been settled separately and by hand
      # (docs/windows-first-run.md); this step is the other one, and the two are genuinely
      # different code paths in Windows rather than the same test run twice. If it fails, the
      # interesting thing is its log, not a red X on a pull request that has nothing to do with
      # Windows.
      #
      # Note that a pass here does NOT prove pixels reached a screen: Present deliberately does
      # not check StretchDIBits' return value (see its comment in internal/platform/win32), so a
      # frame rate is reported whether or not anything was drawn. Proving that took a screenshot,
      # which is what the manual run did.
      #
      # -frames bounds the run so it cannot hang waiting for a quit event that no automated
      # session will ever send; timeout-minutes is the belt to that braces. The bench needs a
      # house and finds one inside the .exe it just built, so this is also where a house is loaded
      # out of the embedded archive on Windows and played -- `go test ./assets` above only proves
      # the archive opens there.
      #
      # The bench opens audio too, and on a runner with no sound card that is worth as much as the
      # opposite would be: it is the path a player on a machine without one takes, so the log
      # should show the game reporting no output and playing on rather than refusing to start.
      # `-audio list` before it is the cheap version of the same question, printed on its own line.
      - name: On-screen bench, the win32 backend in a service session (best effort)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          go build -o glidergo.exe ./cmd/glidergo
          .\glidergo.exe -version
          .\glidergo.exe -audio list
          .\glidergo.exe -frames 300 -bench

      - name: Extract assets to a temp tree (best effort)
        continue-on-error: true
        run: python3 tools/extract_all.py --out "${{ runner.temp }}/assets"
